services:
  archive:
    build:
      context: .
    image: newspaper-phrase-locator:local
    container_name: newspaper-phrase-locator
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: /data/archive.sqlite3
      SEED_DEMO: "true"
    volumes:
      - archive-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 10s

volumes:
  archive-data:
